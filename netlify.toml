# Netlify settings. This is a static site: there is no build step.
[build]
  publish = "."

# Friendly project URLs: richardwademorgan.com/stord, /delta-pride, and so on.
# Each is served by project.html, which reads the project name from the path.
[[redirects]]
  from = "/google-search"
  to = "/project.html"
  status = 200
[[redirects]]
  from = "/delta-centennial"
  to = "/project.html"
  status = 200
[[redirects]]
  from = "/delta-pride"
  to = "/project.html"
  status = 200
[[redirects]]
  from = "/stord"
  to = "/project.html"
  status = 200
[[redirects]]
  from = "/outsports"
  to = "/project.html"
  status = 200
[[redirects]]
  from = "/design-archive"
  to = "/project.html"
  status = 200

# Security and caching headers. CSS and JS "no-cache" means browsers ask Netlify
# whether a file changed on every visit (a quick check, not a re-download), so
# a new deploy shows up right away, including on phones.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
